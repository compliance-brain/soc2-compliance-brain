# ── Compliance Shapes – Service & Customer ────────────────────────────────
# Who operates the environment the service runs in. Sets which controls you own, which customers own (CUECs), and where the system boundary sits. [H]
#   Options: TBC, Provider-hosted, Shared, Customer-hosted, Unsure
Hosting responsibility: Provider-hosted  # example
# How customers are separated from each other. Drives segregation and data access controls, and how isolation is evidenced to customers. [M]
#   Options: TBC, Multi-tenant, Isolated, Dedicated, Unsure
Tenancy & isolation: Multi-tenant  # example
# How much sensitive data the service takes in. Less data means fewer privacy, retention and encryption controls to design and evidence. [M]
#   Options: TBC, Broad, Purpose-limited, Minimised, Unsure
Data minimisation: Purpose-limited  # example
# Who decides where customer data is stored. Shapes residency commitments, encryption keys and the data-related CUECs. [M]
#   Options: TBC, Provider-controlled, Shared, Customer-controlled, Unsure
Data control boundary: Provider-controlled  # example
# How much customers rely on the service being up. Drives backup, DR, capacity and monitoring controls, and whether Availability is in scope. [H]
#   Options: TBC, Best efforts, Targeted availability, Committed availability, Unsure
Availability responsibility: Targeted availability  # example
# How customers connect to the service. APIs and webhooks add key management, secure development and integration CUECs. [M]
#   Options: TBC, Closed, Integrated, API-first / extensible, Unsure
Integration surface: Integrated  # example
# How central AI is to what customers receive. Adds AI governance, output monitoring and model provider controls as reliance grows. [H]
#   Options: TBC, Peripheral, Assistive, AI-native, Agentic, Unsure
AI reliance: Peripheral  # example
# Who administers customers' users and settings. Sets whether access CUECs apply or your own admin access controls carry the weight. [H]
#   Options: TBC, Customer-managed, Shared, Provider-managed, Unsure
Customer administration: Customer-managed  # example
# Who owns the results the service produces. Shapes commitments, processing integrity and how much customers must validate outputs. [L]
#   Options: TBC, Customer-directed, Shared, Provider-reliant, Unsure
Responsibility for outcomes: Customer-directed  # example
# How much the service varies per customer. Custom or managed elements add change and customer-specific controls to evidence. [L]
#   Options: TBC, Standardised, Configurable, Customised / managed, Unsure
Service standardisation: Standardised  # example
# When your people can see customer data. Drives support access, approval and logging controls, and confidentiality commitments. [H]
#   Options: TBC, Routine, Exception-only, Technically restricted, Unsure
Provider access to customer data: Exception-only  # example

