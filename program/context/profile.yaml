# REFERENCE PROFILE. These answers describe the example company the program is drafted for:
# a simple, fully remote 10-person B2B SaaS on AWS, with Google Workspace sign-in, code on GitHub and
# company-managed laptops, going for SOC 2 Security. Each example answer ends with "# example".
# Replace each one with your own answer and delete the "# example" marker; tools/check.py lists any left.
# Then run tools/scope.py to see how your scope differs from the reference company.
# Company profile: your compliance context, read by your AI agent and by tools/scope.py.
# Format: one "Field: answer" per line. Separate several answers with commas.
# Use TBC when you don't know yet, Unsure when it's unclear, and "None / not used" when it doesn't apply.
# Allowed answers for list fields are in brain/library/field-options.csv.
# Impact: H = the agent relies on it most, M = sharpens controls and evidence, L = useful detail.
# Never put passwords, keys or personal details here.


# ── Where your compliance program lives ───────────────────────────────────
# Where your agent builds and keeps your program. Pick the tool your team already works in. Note any second tool under What lives where. [H]
#   Options: Notion, monday.com, Google Workspace (Drive, Docs and Sheets), Microsoft 365 (SharePoint and OneDrive), GitHub (this repository), Vanta, Drata, Secureframe, Delve, Sprinto, Other (explain in notes), TBC, Unsure
Program home: GitHub (this repository)  # example
# If you use more than one tool, say what goes in each. E.g. policies, risk and vendor registers in Notion; other audit evidence collated in Drive.
What lives where: Policies, registers and records in this repository; evidence files in {{evidence folder · e.g. a Google Drive folder}}  # example

# ── Your Compliance Agent ─────────────────────────────────────────────────
