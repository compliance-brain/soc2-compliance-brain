Agent role: Compliance Manager (executor)  # example
# Where you'll work with the agent day to day. Shapes how it reaches you, shares updates and collects what it needs. [H]
#   Options: Slack, Agentic platform, Browser agent, Chat interface, TBC
Where you'll use it: Chat interface  # example
# How the agent should approach your compliance. Defaults reflect a lean, engineering-led model. Remove any that don't fit; add your own. [M]
#   Options: see brain/library/field-options.csv (9 options)
Design principles: Minimise manual controls, Prefer existing workflows, Keep policies concise, No committees just for compliance, Evidence from source systems  # example

